[package]
name = "gpui-hot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "App side of `cargo gpui dev`: Subsecond hot patching and reload state for GPUI apps on Android"

[dependencies]
gpui-hot-macros = { path = "../gpui-hot-macros" }
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }
subsecond = "0.7.10"
anyhow = "1"
log = "0.4"
serde_json = "1"
libc = "0.2"
