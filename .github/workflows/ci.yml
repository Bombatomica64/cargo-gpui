name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the CLI
        run: cargo build --locked
      - name: Check the attribute macro
        run: cargo check --locked -p gpui-hot-macros
